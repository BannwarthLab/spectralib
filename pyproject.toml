[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spectralib"
version = "0.0.2"
description = "Analysis Tools for LUM and CPL Dataset."
readme = "README.md"
license = "CC-BY-SA-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"

authors = [
    {name = "Mike Pauls"},
    {name = "Nicole Maser"},
]

maintainers = [
    {name = "Mike Pauls"},
]

dependencies = [
    "numpy",
    "scipy",
    "tcgm-unitkit @ git+https://gitlab.git.nrw/rwth-bannwarthlab/tcgm-unitkit.git@main",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
plot = [
    "matplotlib",
]

# pinned: the MolBar version is part of every barcode, InChI output depends on the Open Babel build.
# MolBar ships no Windows wheel, so the extra installs without it there and
# comp_fingerprints is unavailable on Windows.
fingerprint = [
    "joblib",
    "openbabel==3.2.1",
    "molbar==1.2.0; sys_platform != 'win32'",
]

dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
    "build",
    "mypy",
    "matplotlib",
]

docs = [
    "sphinx",
    "sphinx_rtd_theme",
    "sphinxcontrib-bibtex",
]

[project.scripts]
comp_fingerprints = "spectralib.scripts.compute_fingerprints:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["spectralib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "dataset: requires the benchmark dataset in data/, i.e. a repository checkout",
]

[tool.mypy]
exclude = ["docs"]
ignore_missing_imports = true
no_implicit_optional = false
packages = "spectralib"

[tool.ruff]
target-version = "py312"
extend-exclude = ["tests"]
line-length = 121
