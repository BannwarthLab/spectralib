[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpl50"
version = "0.0.1"
description = "Analysis Tools for LUM and CPL Dataset."
authors = [{name = "Mike Pauls"}]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "tcgm_unitkit @ git+https://gitlab.git.nrw/rwth-bannwarthlab/utils/tcgm_unitkit.git",
]

[project.optional-dependencies]
plot = ["matplotlib"]
test = [
    "matplotlib",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 121
extend-exclude = ["workflows"]  # moved scripts, kept unchanged for discussion
