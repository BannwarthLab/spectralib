[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spectralib"
version = "1.0.0"
description = "Analysis Tools for Spectroscopic Data"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"

authors = [
    {name = "Mike Pauls"},
    {name = "Nicole Maser"},
    {name = "Gereon Feldmann"},
    {name = "Christoph Bannwarth"},
]

maintainers = [
    {name = "Mike Pauls"},
]

dependencies = [
    "numpy",
    "scipy",
    "tcgm-unitkit @ git+https://gitlab.git.nrw/rwth-bannwarthlab/tcgm-unitkit.git@v0.1.0",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://gitlab.git.nrw/rwth-bannwarthlab/spectralib"
Documentation = "https://rwth-bannwarthlab.pages.git.nrw/spectralib"
Repository = "https://gitlab.git.nrw/rwth-bannwarthlab/spectralib.git"
Issues = "https://gitlab.git.nrw/rwth-bannwarthlab/spectralib/-/issues"

[project.optional-dependencies]
plot = [
    "matplotlib",
]

# As of Nov 15, 2026 MolBar does not have a Windows wheel, so 
# comp_fingerprints is unavailable on Windows at the moment.
fingerprint = [
    "joblib",
    "openbabel==3.2.1",
    "molbar==1.2.0; sys_platform != 'win32'",
]

dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
    "build",
    "mypy",
    "matplotlib",
]

docs = [
    "sphinx",
    "sphinx_rtd_theme",
    "sphinxcontrib-bibtex",
    "myst-parser",
    "matplotlib", 
]

[project.scripts]
comp_fingerprints = "spectralib.scripts.compute_fingerprints:main"
summarize_spectra = "spectralib.scripts.summarize_spectra:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["spectralib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "dataset: validates the format and consistency of the data in data/",
    "library: tests the code of spectralib (set automatically for every test without the dataset marker)",
]

[tool.mypy]
exclude = ["docs"]
ignore_missing_imports = true
no_implicit_optional = false
packages = "spectralib"

[tool.ruff]
target-version = "py312"
extend-exclude = ["tests"]
line-length = 121
