[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cpl50"
version = "0.0.2"
description = "Analysis Tools for LUM and CPL Dataset."
readme = "README.md"
license = "CC-BY-SA-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"

authors = [
    {name = "Mike Pauls"},
    {name = "Nicole Maser"},
]

maintainers = [
    {name = "Mike Pauls"},
]

dependencies = [
    "numpy",
    "scipy",
    "tcgm_unitkit @ git+ssh://git@gitlab.git.nrw/rwth-bannwarthlab/utils/tcgm_unitkit.git@main"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
plot = [
    "matplotlib",
]

# pinned: the MolBar version is part of every barcode, InChI output depends on the Open Babel build
fingerprint = [
    "joblib",
    "molbar==1.2.0",
    "openbabel==3.2.1",
]

dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
    "build",
    "mypy",
    "matplotlib",
]

docs = [
    "sphinx",
    "sphinx_rtd_theme",
    "sphinxcontrib-bibtex",
]

[project.scripts]
comp_fingerprints = "cpl50.scripts.compute_fingerprints:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cpl50*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
exclude = ["docs"]
ignore_missing_imports = true
no_implicit_optional = false
packages = "cpl50"

[tool.ruff]
target-version = "py312"
extend-exclude = ["tests"]
line-length = 121
