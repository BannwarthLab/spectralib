image: python:3.13

stages:
  - lint
  - test

before_script:
  - python -m pip install --upgrade pip 
  - python -m venv .venv
  - source .venv/bin/activate
  - python -m pip install -e .[test]


lint:
  stage: lint
  script:
    - source .venv/bin/activate
    - ruff check .
  tags:
    - docker

test:
  stage: test
  script:
    - source .venv/bin/activate
    - python -m pytest tests -v
