.build_container:
  script:
    - export CONTAINER_NAME="${OS}-${PYTHON}"
    - echo ${CONTAINER_NAME}
    - python3 .gitlab/generate_recipe.py ${CONTAINER_NAME}
    - export B64_TOKEN=$(echo -n "gitlab-ci-token:${CI_JOB_TOKEN}" | base64 -w0)
    - |
      cat << EOF > .gitconfig_build
      [url "https://gitlab.git.nrw/"]
          insteadOf = git@gitlab.git.nrw:
          insteadOf = ssh://git@gitlab.git.nrw/
      [http "https://gitlab.git.nrw/"]
          extraheader = Authorization: Basic ${B64_TOKEN}
      EOF
    - /gitlab-runner/build_container.sh ${CONTAINER_NAME}.def
    - rm -f .gitconfig_build